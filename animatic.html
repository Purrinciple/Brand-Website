<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Poster Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class = "animation-top">

  <div class="animation-hero">
    <img src="images/placeholder.png" alt="">
  </div>

  <div class="hero-text">
    <h1>Poster Animation</h1>
    <p>
        Taking an existing poster design and animating it
    </p>
  </div>

</section>

<section class="animation-hero">

  <h1>Animated Poster</h1>

  <div class="video-container">
    <iframe 
      src="https://www.youtube.com/embed/v=HOSZrf7pCVo"
      title="Animated Poster"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

</section>

<section class="animation-breakdown">

  <h2>Key Moments</h2>

  <div class="moment-grid">

    <div class="moment">
      <img src="images/moment1.gif">
      <p>Opening transition establishes tone</p>
    </div>

    <div class="moment">
      <img src="images/moment2.gif">
      <p>Typography animation reinforces hierarchy</p>
    </div>

    <div class="moment">
      <img src="images/moment3.gif">
      <p>Final sequence resolves composition</p>
    </div>

  </div>

</section>

</body>
</html>
